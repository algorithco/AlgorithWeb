# Topology (two stacks, one shared network):
#   1. Account stack FIRST:  (in algorith-account)
#      cd infra
#      docker compose --env-file ../.env --env-file ../.env.tunnel \
#        --env-file ../apps/api/.env \
#        -f docker-compose.yml -f docker-compose.tunnel.yml up --build -d
#      owns postgres/redis/api/caddy + creates network `algorithco-platform`.
#   2. This gateway SECOND:  (here)
#      docker compose -f compose.frontends.yml up --build -d
#      company-web proxies /api/guard/* -> guard-backend (same stack) and
#      /api/account/* -> algorithco-account-api (account stack, shared net).
# Boot order matters: the shared network is created by the account stack.
name: algorithco

services:
  # Guard's own Postgres (separate from the account stack's database: guard
  # must never share tables with identity/billing). No host port published;
  # reachable only inside this compose network as guard-postgres:5432.
  # Local-dev password only; production uses the secret manager + external DB.
  guard-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: guard
      POSTGRES_PASSWORD: ${GUARD_POSTGRES_PASSWORD:-guard-dev-pw-change-me}
      POSTGRES_DB: guard
    volumes:
      - guard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guard -d guard"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s

  guard-backend:
    build:
      context: ../algorith-guard/backend
    restart: unless-stopped
    env_file:
      - ../algorith-guard/backend/.env.tunnel
    environment:
      DATABASE_URL: postgresql://guard:${GUARD_POSTGRES_PASSWORD:-guard-dev-pw-change-me}@guard-postgres:5432/guard
    depends_on:
      guard-postgres:
        condition: service_healthy

  # ---- Algorith Voice backend (VOICE_INTEGRATION_PLAN.md, phase 3) ----
  # Own Postgres and Redis: Voice never shares tables with identity/billing.
  # Identity and plans come from the account service (issuer + service key);
  # the account reaches voice-backend for entitlement.changed webhooks over
  # the shared platform network. No host ports: traffic enters through the
  # gateway at /api/voice.
  voice-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: ${VOICE_POSTGRES_PASSWORD:-voice-dev-pw-change-me}
      POSTGRES_DB: voice
    volumes:
      - voice-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during first-boot init the temporary server only
      # listens on the socket, so a socket check passes too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U voice -d voice"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s

  voice-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - voice-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8

  voice-migrate:
    build:
      context: ../algorith-voice
      dockerfile: apps/backend/Dockerfile
    image: algorithco-voice-backend:local
    restart: "no"
    environment:
      DATABASE_URL: postgresql://voice:${VOICE_POSTGRES_PASSWORD:-voice-dev-pw-change-me}@voice-postgres:5432/voice
    command: ["prisma", "migrate", "deploy", "--schema", "infra/prisma/schema.prisma"]
    depends_on:
      voice-postgres:
        condition: service_healthy

  voice-backend:
    image: algorithco-voice-backend:local
    restart: unless-stopped
    env_file:
      # VOICE_ACCOUNT_SERVICE_KEY, VOICE_ACCOUNT_WEBHOOK_SECRET (issued by the
      # account CLI), VOICE_ADMIN_SUBJECTS and provider keys such as
      # OPENROUTER_API_KEY. Optional so
      # the gateway still builds without it; voice-backend then refuses to
      # start (production requires the service key).
      - path: ../algorith-voice/.env.gateway.local
        required: false
    environment: &voice-env
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://voice:${VOICE_POSTGRES_PASSWORD:-voice-dev-pw-change-me}@voice-postgres:5432/voice
      REDIS_URL: redis://voice-redis:6379
      APP_URL: https://trqsh.uz
      VOICE_ACCOUNT_ISSUER: https://trqsh.uz/account
      VOICE_ACCOUNT_AUDIENCES: algorithco-platform-api
      VOICE_ACCOUNT_CLIENT_IDS: algorithco-platform-web,voice-desktop
      VOICE_ACCOUNT_REQUIRED_SCOPES: voice:access
      # The gateway and the Docker host hop in front of it (see
      # algorith-voice/infra/docker-compose.yml): rate limits per visitor.
      TRUST_PROXY_HOPS: "2"
      LOG_LEVEL: info
    networks:
      - default
      - platform
    depends_on:
      voice-migrate:
        condition: service_completed_successfully
      voice-redis:
        condition: service_healthy

  voice-worker:
    image: algorithco-voice-backend:local
    restart: unless-stopped
    env_file:
      - path: ../algorith-voice/.env.gateway.local
        required: false
    environment: *voice-env
    command: ["node", "apps/backend/dist/queues/worker.js"]
    healthcheck:
      disable: true
    depends_on:
      voice-migrate:
        condition: service_completed_successfully
      voice-redis:
        condition: service_healthy

  company-web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://trqsh.uz
        NEXT_PUBLIC_VOICE_URL: https://trqsh.uz/app/voice
        NEXT_PUBLIC_GUARD_URL: https://trqsh.uz/app/guard
        NEXT_PUBLIC_ACCOUNT_ISSUER: https://trqsh.uz/account
        NEXT_PUBLIC_ACCOUNT_CLIENT_ID: algorithco-platform-web
        NEXT_PUBLIC_ACCOUNT_REDIRECT_URI: https://trqsh.uz/auth/callback
        NEXT_PUBLIC_ACCOUNT_BILLING_URL: https://trqsh.uz/account
        NEXT_PUBLIC_GUARD_API_BASE: /api/guard
        NEXT_PUBLIC_ACCOUNT_API_BASE: /api/account
        NEXT_PUBLIC_VOICE_API_BASE: /api/voice
    restart: unless-stopped
    networks:
      - default
      - platform
    depends_on:
      # Unordered on purpose (no service_healthy gate): single-host auth
      # makes guard depend on this gateway for OIDC discovery
      # (trqsh.uz/account/.well-known), so gating the gateway on guard
      # readiness deadlocks both. /api/guard/* briefly 502s until guard
      # is up; the gateway itself is fully static otherwise. Voice is not
      # listed at all: nginx resolves voice-backend per request, and a Voice
      # failure (e.g. a migration) must never keep the site down.
      - guard-backend
    ports:
      - "127.0.0.1:3000:80"
      # Compatibility listener while the managed tunnel route is moved to 3000.
      - "127.0.0.1:3007:80"

networks:
  platform:
    name: algorithco-platform
    external: true

volumes:
  guard-postgres-data:
  voice-postgres-data:
  voice-redis-data:
