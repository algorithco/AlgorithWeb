server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  # Docker embedded DNS; resolving via variable keeps Nginx starting when an
  # optional backend profile (e.g. account) is not running. Requests then 502
  # with a clear body instead of blocking the whole gateway at boot.
  resolver 127.0.0.11 valid=10s;

  location /api/guard/ {
    # NOTE: proxy_pass with a variable passes the original URI unchanged, so
    # the prefix must be stripped explicitly (a static proxy_pass with a
    # trailing slash would do it implicitly). `set` MUST precede `rewrite ..
    # break`: break halts the rewrite phase, so anything after it never runs.
    set $guard_upstream http://guard-backend:8080;
    rewrite ^/api/guard/(.*)$ /$1 break;
    proxy_pass $guard_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 10s;
    client_max_body_size 1m;
  }

  # Company Account API. Allowlist: only product-facing v1 reads/writes are
  # proxied. Everything else 404s so admin/service-key routes are never exposed
  # through the public site. Upstream is the account stack's `api` service
  # (stable container name, shared `algorithco-platform` network — boot the
  # account stack before this gateway).
  location ~ ^/api/account/v1/(entitlements|billing|licenses|orgs|users)(/.*)?$ {
    # `set` before `rewrite .. break` (see /api/guard/ note above).
    set $account_upstream http://algorithco-account-api:3000;
    rewrite ^/api/account(/.*)$ $1 break;
    proxy_pass $account_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 10s;
    client_max_body_size 1m;
  }

  location /api/account/ {
    return 404 '{"error":"not_found"}';
  }

  # Company Account UI + OIDC issuer, single-host auth. The account service
  # registers all human pages and protocol endpoints under /account/* (see
  # UI_BASE in algorithco-account/apps/api/src/http/routes.ts) with issuer
  # https://trqsh.uz/account, so login/signup (incl. GitHub/Google buttons)
  # live on the product host. No rewrite: upstream paths are identical.
  # X-Forwarded-Proto is hardcoded to https (not $scheme): the public site
  # is HTTPS-only via the tunnel while tunnel-to-gateway here is plain
  # HTTP. The account service builds absolute discovery/redirect URLs from
  # this header — forwarding $scheme (http) would advertise http:// URLs
  # and break strict verifiers (e.g. guard's JWKS HTTPS pin).
  location /account/ {
    set $account_ui_upstream http://algorithco-account-api:3000;
    proxy_pass $account_ui_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 10s;
    client_max_body_size 1m;
  }

  location = /account {
    return 308 /account/;
  }

  # Service-to-service JSON under the issuer path. The guard backend calls
  # {issuer}/v1/... (issuer is https://trqsh.uz/account) with its service key.
  # Same product-allowlist policy as /api/account/v1/*: strip one segment so
  # upstream sees the root-mounted /v1/* routes. Admin/service-key routes
  # stay unexposed either way (role + credential gated upstream).
  location ~ ^/account/v1/(entitlements|billing|licenses|orgs|users)(/.*)?$ {
    set $account_v1_upstream http://algorithco-account-api:3000;
    rewrite ^/account(/v1/.*)$ $1 break;
    proxy_pass $account_v1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 10s;
    client_max_body_size 1m;
  }

  # Account admin HTML lives at upstream root (/admin/*, not under /account/),
  # so strip one segment. The sibling /api/account/* JSON allowlist above is
  # untouched: it rewrites to /v1/* (service-key routes stay unexposed).
  location /account/admin/ {
    set $account_admin_upstream http://algorithco-account-api:3000;
    rewrite ^/account(/admin/.*)$ $1 break;
    proxy_pass $account_admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 10s;
    client_max_body_size 1m;
  }

  # Voice backend slot. Voice is untouched right now; reserve the path so all
  # products share one gateway convention when voice lands.
  location /api/voice/ {
    return 501 '{"error":"voice_backend_not_configured"}';
  }

  location / {
    try_files $uri.html $uri/index.html $uri =404;
  }
}

server {
  listen 80;
  server_name guard.trqsh.uz;

  location = /auth/callback {
    return 308 https://trqsh.uz$request_uri;
  }

  location = /dashboard {
    return 308 https://trqsh.uz/app;
  }

  location ~ ^/dashboard/(.*)$ {
    return 308 https://trqsh.uz/app/guard/$1;
  }

  location = /docs {
    return 308 https://trqsh.uz/docs/guard;
  }

  location ~ ^/docs/(.*)$ {
    return 308 https://trqsh.uz/docs/guard/$1;
  }

  location / {
    return 308 https://trqsh.uz/products/guard;
  }
}
