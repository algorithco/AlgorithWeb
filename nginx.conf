# The gateway's copy of the latest AlgorithVoice release (/api/releases/voice
# below). `inactive` is long on purpose: a copy that is no longer fresh must
# still be there to serve while GitHub cannot be reached.
proxy_cache_path /var/cache/nginx/voice-release levels=1 keys_zone=voice_release:1m max_size=8m inactive=30d use_temp_path=off;

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  # Docker embedded DNS; resolving via variable keeps Nginx starting when an
  # optional backend profile (e.g. account) is not running. Requests then 502
  # with a clear body instead of blocking the whole gateway at boot.
  resolver 127.0.0.11 valid=10s;

  # Relative Location headers: behind the TLS tunnel nginx only sees plain
  # http, so absolute redirects would point browsers at http://.
  absolute_redirect off;

  location /api/guard/ {
    # NOTE: proxy_pass with a variable passes the original URI unchanged, so
    # the prefix must be stripped explicitly (a static proxy_pass with a
    # trailing slash would do it implicitly). `set` MUST precede `rewrite ..
    # break`: break halts the rewrite phase, so anything after it never runs.
    set $guard_upstream http://guard-backend:8080;
    rewrite ^/api/guard/(.*)$ /$1 break;
    proxy_pass $guard_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 10s;
    client_max_body_size 1m;
  }

  # Company Account API. Allowlist: only product-facing v1 reads/writes are
  # proxied. Everything else 404s so admin/service-key routes are never exposed
  # through the public site. Upstream is the account stack's `api` service
  # (stable container name, shared `algorithco-platform` network — boot the
  # account stack before this gateway).
  location ~ ^/api/account/v1/(entitlements|billing|licenses|orgs|users)(/.*)?$ {
    # `set` before `rewrite .. break` (see /api/guard/ note above).
    set $account_upstream http://algorithco-account-api:3000;
    rewrite ^/api/account(/.*)$ $1 break;
    proxy_pass $account_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 10s;
    client_max_body_size 1m;
  }

  location /api/account/ {
    return 404 '{"error":"not_found"}';
  }

  # Company Account UI + OIDC issuer, single-host auth. The account service
  # registers all human pages and protocol endpoints under /account/* (see
  # UI_BASE in algorithco-account/apps/api/src/http/routes.ts) with issuer
  # https://trqsh.uz/account, so login/signup (incl. GitHub/Google buttons)
  # live on the product host. No rewrite: upstream paths are identical.
  # X-Forwarded-Proto is hardcoded to https (not $scheme): the public site
  # is HTTPS-only via the tunnel while tunnel-to-gateway here is plain
  # HTTP. The account service builds absolute discovery/redirect URLs from
  # this header — forwarding $scheme (http) would advertise http:// URLs
  # and break strict verifiers (e.g. guard's JWKS HTTPS pin).
  #
  # The account service sends its own, stricter security headers, so the
  # gateway's set must not be added on top: two CSPs intersect, and this
  # server's form-action 'self' blocked the redirect that ends the consent
  # form at a native app's loopback callback (http://127.0.0.1:<port>).
  # Declaring any add_header here stops the server-level ones being inherited.
  location /account/ {
    add_header X-Content-Type-Options "nosniff" always;
    set $account_ui_upstream http://algorithco-account-api:3000;
    proxy_pass $account_ui_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 10s;
    client_max_body_size 1m;
  }

  location = /account {
    return 308 /account/;
  }

  # Service-to-service JSON under the issuer path. The guard backend calls
  # {issuer}/v1/... (issuer is https://trqsh.uz/account) with its service key.
  # Same product-allowlist policy as /api/account/v1/*: strip one segment so
  # upstream sees the root-mounted /v1/* routes. Admin/service-key routes
  # stay unexposed either way (role + credential gated upstream).
  location ~ ^/account/v1/(entitlements|billing|licenses|orgs|users)(/.*)?$ {
    set $account_v1_upstream http://algorithco-account-api:3000;
    rewrite ^/account(/v1/.*)$ $1 break;
    proxy_pass $account_v1_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 10s;
    client_max_body_size 1m;
  }

  # Account admin HTML lives at upstream root (/admin/*, not under /account/),
  # so strip one segment. The sibling /api/account/* JSON allowlist above is
  # untouched: it rewrites to /v1/* (service-key routes stay unexposed).
  location /account/admin/ {
    set $account_admin_upstream http://algorithco-account-api:3000;
    rewrite ^/account(/admin/.*)$ $1 break;
    proxy_pass $account_admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 10s;
    client_max_body_size 1m;
  }

  # Algorith Voice API (same convention as /api/guard). The account service
  # delivers entitlement webhooks to voice-backend over the private platform
  # network, and the API docs are for operators, so neither is public.
  location ~ ^/api/voice/(account/|docs) {
    return 404;
  }
  location /api/voice/ {
    set $voice_upstream http://voice-backend:3001;
    rewrite ^/api/voice/(.*)$ /$1 break;
    proxy_pass $voice_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    # Cloud transcription: up to 25 MB of audio, primary + fallback provider.
    client_max_body_size 26m;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  # The latest public AlgorithVoice desktop release, for /voice/download. The
  # page is built with the release that was current at build time and asks
  # here for the current one, so a new version shows up without a rebuild and
  # visitors' browsers still never call GitHub.
  # The upstream URL and the cache key are fixed and nothing a visitor sends
  # (query, headers, body) is passed on, so no request can force a call to
  # GitHub: at most 12 an hour leave this server, of the 60 GitHub allows
  # without a token. When GitHub fails or rate-limits, the last good copy is
  # served; with no copy at all the page keeps the release it was built with.
  location = /api/releases/voice {
    limit_except GET {
      deny all;
    }
    set $github_api https://api.github.com;
    proxy_pass $github_api/repos/algorithco/algorithvoice-app/releases/latest;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name api.github.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host api.github.com;
    # GitHub rejects requests without a User-Agent.
    proxy_set_header User-Agent "algorithco-web";
    proxy_set_header Accept "application/vnd.github+json";
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;

    proxy_cache voice_release;
    proxy_cache_key voice-release-latest;
    # GitHub asks for 60 s; five minutes keeps this server inside the limit.
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_cache_valid 200 5m;
    proxy_cache_valid any 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;

    # GitHub's own policy and bookkeeping headers: the server block above sets
    # this site's, and the rest describe this server's quota, not the visitor's.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Vary;
    proxy_hide_header X-RateLimit-Limit;
    proxy_hide_header X-RateLimit-Remaining;
    proxy_hide_header X-RateLimit-Used;
    proxy_hide_header X-RateLimit-Resource;
    proxy_hide_header X-RateLimit-Reset;
    proxy_hide_header X-GitHub-Request-Id;
    proxy_hide_header X-GitHub-Media-Type;
    proxy_hide_header X-GitHub-Api-Version-Selected;
    proxy_hide_header X-GitHub-Edge-Region;
  }

  # Product sections moved from /products/* to /voice and /guard
  # (WEBSITE_LAYOUT_PLAN.md); old links keep working.
  location = /products {
    return 308 /#products;
  }
  location ~ ^/products/(voice|guard)/?$ {
    return 308 /$1;
  }

  # The documentation of every product moved from /voice/docs and /guard/docs
  # to one site under /docs/<product>; old links keep working. Regex
  # locations match in order, so the renamed page comes first.
  location ~ ^/(guard/docs|docs/guard)/architecture/?$ {
    return 308 /docs/guard/how-it-works;
  }
  location ~ ^/(voice|guard)/docs/?$ {
    return 308 /docs/$1;
  }
  location ~ ^/(voice|guard)/docs/(.+?)/?$ {
    return 308 /docs/$1/$2;
  }

  location / {
    try_files $uri.html $uri/index.html $uri =404;
  }
}

server {
  listen 80;
  server_name guard.trqsh.uz;

  location = /auth/callback {
    return 308 https://trqsh.uz$request_uri;
  }

  location = /dashboard {
    return 308 https://trqsh.uz/app;
  }

  location ~ ^/dashboard/(.*)$ {
    return 308 https://trqsh.uz/app/guard/$1;
  }

  location = /docs {
    return 308 https://trqsh.uz/docs/guard;
  }

  location ~ ^/docs/(.*)$ {
    return 308 https://trqsh.uz/docs/guard/$1;
  }

  location / {
    return 308 https://trqsh.uz/guard;
  }
}
